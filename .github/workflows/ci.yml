name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly security scan so new CVEs are caught even without new commits
    - cron: "0 3 * * 1"

# Cancel older runs of the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE: Quality and security scans use continue-on-error, while the automated
# backend test suite validates correctness and fails on test failures.

jobs:
  # ---------------------------------------------------------------------------
  # Frontend (Next.js): code quality + dependency security
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (code quality + security)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Lint (ESLint)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Type check (tsc)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build check
        run: npm run build
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Backend (FastAPI): code quality + security (no dependency install needed)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (code quality + security)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Lint (ruff)
        run: ruff check backend
        continue-on-error: true

      - name: Format check (ruff format)
        run: ruff format --check backend
        continue-on-error: true

      - name: Security analysis (bandit, medium severity and above)
        run: bandit -r backend -x backend/tests -ll
        continue-on-error: true

      - name: Vulnerable dependency check (pip-audit)
        run: pip-audit -r backend/requirements.txt --no-deps --disable-pip
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Backend Tests (FastAPI / pytest): automated non-interactive test suite
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run backend tests
        run: |
          python -m pytest -v

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # CodeQL (needs a public repo or GitHub Advanced Security)
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        continue-on-error: true
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"

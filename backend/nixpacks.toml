[phases.setup]
nixPkgs = [
  "ffmpeg",
  "libGL",
  "libGLU",
  "xorg.libX11",
  "xorg.libxcb",
  "xorg.libXext",
  "xorg.libXrender",
  "glib"
]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
  "pip uninstall -y opencv-python || true",
  "pip install --force-reinstall --no-deps opencv-python-headless"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
